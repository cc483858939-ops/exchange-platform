name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend / Unit and Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Go.exchange
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Go.exchange/go.mod
          cache-dependency-path: Go.exchange/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not gofmt formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: Backend baseline tests
        run: go test ./... -count=1

  backend-integration:
    name: Backend / PostgreSQL and Redis Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Go.exchange
    env:
      DATABASE_DSN: "host=127.0.0.1 user=postgres password=postgres dbname=goexchange_test port=5432 sslmode=disable TimeZone=UTC"
      POSTGRES_TEST_DSN: "host=127.0.0.1 user=postgres password=postgres dbname=goexchange_test port=5432 sslmode=disable TimeZone=UTC"
      REDIS_TEST_ADDR: "127.0.0.1:6379"
      REDIS_TEST_DB: "15"
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: goexchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d goexchange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Go.exchange/go.mod
          cache-dependency-path: Go.exchange/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Configure PostgreSQL logical replication
        shell: bash
        run: |
          set -euo pipefail

          postgres_container="$(
            docker ps \
              --filter ancestor=pgvector/pgvector:pg16 \
              --format '{{.ID}}' |
            head -n 1
          )"
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found"
            exit 1
          fi

          docker exec "$postgres_container" \
            psql \
            -U postgres \
            -d goexchange_test \
            -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET wal_level = 'logical';"
          docker exec "$postgres_container" \
            psql \
            -U postgres \
            -d goexchange_test \
            -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_replication_slots = '4';"
          docker exec "$postgres_container" \
            psql \
            -U postgres \
            -d goexchange_test \
            -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_wal_senders = '4';"

          docker restart "$postgres_container"

          ready=0
          for attempt in $(seq 1 30); do
            if docker exec "$postgres_container" \
                pg_isready \
                -U postgres \
                -d goexchange_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "PostgreSQL did not become ready after logical replication configuration"
            exit 1
          fi

          wal_level="$(
            docker exec "$postgres_container" \
              psql -U postgres -d goexchange_test -Atqc "SHOW wal_level"
          )"
          max_replication_slots="$(
            docker exec "$postgres_container" \
              psql -U postgres -d goexchange_test -Atqc "SHOW max_replication_slots"
          )"
          max_wal_senders="$(
            docker exec "$postgres_container" \
              psql -U postgres -d goexchange_test -Atqc "SHOW max_wal_senders"
          )"

          if [ "$wal_level" != "logical" ]; then
            echo "wal_level=$wal_level; want logical"
            exit 1
          fi
          if ! [[ "$max_replication_slots" =~ ^[0-9]+$ ]] || (( max_replication_slots < 2 )); then
            echo "max_replication_slots=$max_replication_slots; want >= 2"
            exit 1
          fi
          if ! [[ "$max_wal_senders" =~ ^[0-9]+$ ]] || (( max_wal_senders < 2 )); then
            echo "max_wal_senders=$max_wal_senders; want >= 2"
            exit 1
          fi

          echo "PostgreSQL replication settings:"
          echo "wal_level=$wal_level"
          echo "max_replication_slots=$max_replication_slots"
          echo "max_wal_senders=$max_wal_senders"

      - name: Run first migration
        run: go run ./cmd/migrate

      - name: Run second migration
        run: go run ./cmd/migrate

      - name: Run integration tests
        shell: bash
        run: |
          set +e
          set -o pipefail

          go test -v ./... -count=1 -p 1 2>&1 | tee "$RUNNER_TEMP/go-integration.log"
          test_status=${PIPESTATUS[0]}

          missing_env=0
          if grep -Fq "set POSTGRES_TEST_DSN to run" "$RUNNER_TEMP/go-integration.log"; then
            echo "Required PostgreSQL integration tests were skipped because POSTGRES_TEST_DSN was unavailable."
            missing_env=1
          fi
          if grep -Fq "set REDIS_TEST_ADDR to run Redis integration test" "$RUNNER_TEMP/go-integration.log"; then
            echo "Required Redis integration tests were skipped because REDIS_TEST_ADDR was unavailable."
            missing_env=1
          fi

          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if [ "$missing_env" -ne 0 ]; then
            exit 1
          fi

  kafka-bootstrap:
    name: Kafka / Topic Bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Go.exchange
    env:
      KAFKA_BROKERS: "127.0.0.1:9092"
    services:
      kafka:
        image: bitnamilegacy/kafka:4.0.0-debian-12-r10
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 0
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
        options: >-
          --health-cmd "kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: Go.exchange/go.mod
          cache-dependency-path: Go.exchange/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Provision topics first time
        run: go run ./cmd/kafka-init

      - name: Provision topics idempotently
        run: go run ./cmd/kafka-init

      - name: Assert broker exposes all provisioned topics
        shell: bash
        run: |
          set -euo pipefail

          kafka_container="$(
            docker ps \
              --filter ancestor=bitnamilegacy/kafka:4.0.0-debian-12-r10 \
              --format '{{.ID}}' |
            head -n 1
          )"

          if [ -z "$kafka_container" ]; then
            echo "Kafka service container was not found"
            exit 1
          fi

          topics="$(
            docker exec "$kafka_container" \
              kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --list
          )"

          # Keep this list aligned with:
          # eventing.RequiredKafkaTopics
          # eventing.KafkaConnectInternalTopicSpecs
          expected_topics=(
            "goexchange.user.behavior.v1"
            "goexchange.post.like.snapshot.v1"
            "goexchange.recommendation.events.v1"
            "goexchange.post.embedding.v1"
            "goexchange.activity.events.v1"
            "goexchange.notification.projection.dlq.v1"
            "goexchange.connect.configs"
            "goexchange.connect.offsets"
            "goexchange.connect.status"
          )

          for topic in "${expected_topics[@]}"; do
            if ! printf '%s\n' "$topics" | grep -Fxq "$topic"; then
              echo "Missing required Kafka topic: $topic"
              echo "Broker topics:"
              printf '%s\n' "$topics"
              exit 1
            fi
          done

          assert_partition_count() {
            local topic="$1"
            local expected="$2"
            local actual

            actual="$(
              docker exec "$kafka_container" \
                kafka-topics.sh \
                --bootstrap-server localhost:9092 \
                --describe \
                --topic "$topic" |
              awk -F'PartitionCount: ' 'NR==1 {print $2}' |
              awk '{print $1}'
            )"

            if [ "$actual" != "$expected" ]; then
              echo "Unexpected partition count for $topic: got=$actual want=$expected"
              exit 1
            fi
          }

          assert_partition_count "goexchange.activity.events.v1" "12"
          assert_partition_count "goexchange.notification.projection.dlq.v1" "3"
  frontend:
    name: Frontend / Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Exchangeapp_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Exchangeapp_frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend production build
        run: npm run build

  container-build:
    name: Containers / Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f Go.exchange/Dockerfile.prod -t goexchange-backend:ci Go.exchange

      - name: Build frontend image
        run: docker build -f Exchangeapp_frontend/Dockerfile -t goexchange-frontend:ci Exchangeapp_frontend
