# Full-stack development compose file.
# Root directory: D:/code/mf
# Usage: cd D:/code/mf && docker compose up -d

x-go-service: &go-service
  image: goexchange-app
  build:
    context: ./Go.exchange
    dockerfile: Dockerfile.dev
  working_dir: /workspace/mf/Go.exchange
  volumes:
    - ./:/workspace/mf:cached
    - go-mod-cache:/home/vscode/go/pkg/mod
    - go-build-cache:/home/vscode/.cache/go-build
  depends_on:
    - db
    - redis
    - kafka
    - minio

x-go-environment: &go-environment
  DATABASE_DSN: "${DATABASE_DSN:-host=db user=postgres password=1234 dbname=test port=5432 sslmode=disable TimeZone=Asia/Shanghai}"

services:
  frontend:
    build:
      context: ./Exchangeapp_frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./Exchangeapp_frontend:/app:cached
      - /app/node_modules
    depends_on:
      - api
    environment:
      - NODE_ENV=development
      - API_URL=http://api:3000
    restart: unless-stopped

  migrate:
    <<: *go-service
    command: ["go", "run", "./cmd/migrate"]
    environment:
      <<: *go-environment
    depends_on:
      db:
        condition: service_healthy

  kafka-init:
    <<: *go-service
    command: ["go", "run", "./cmd/kafka-init"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "${KAFKA_BROKERS:-}"
    restart: "no"
  api:
    <<: *go-service
    command: ["go", "run", "main.go"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      <<: *go-environment
      APP_RUNTIME_ROLE: api
      RECOMMENDATION_TELEMETRY_ENABLED: ${RECOMMENDATION_TELEMETRY_ENABLED:-true}
      RECOMMENDATION_TELEMETRY_ROLLOUT_PERCENT: ${RECOMMENDATION_TELEMETRY_ROLLOUT_PERCENT:-100}
      RECOMMENDATION_TELEMETRY_SIGNING_KEY: ${RECOMMENDATION_TELEMETRY_SIGNING_KEY:-local-development-only-recommendation-key}
      RECOMMENDATION_TELEMETRY_TOKEN_TTL: ${RECOMMENDATION_TELEMETRY_TOKEN_TTL:-24h}
      RECOMMENDATION_TELEMETRY_MAX_CLOCK_SKEW: ${RECOMMENDATION_TELEMETRY_MAX_CLOCK_SKEW:-5m}
      RECOMMENDATION_TELEMETRY_EVENTS_PER_MINUTE: ${RECOMMENDATION_TELEMETRY_EVENTS_PER_MINUTE:-1000}
    ports:
      - "127.0.0.1:3000:3000"

  worker:
    <<: *go-service
    command: ["go", "run", "main.go"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment:
      <<: *go-environment
      APP_RUNTIME_ROLE: worker
      LIKE_BEHAVIOR_BATCH_SIZE: ${LIKE_BEHAVIOR_BATCH_SIZE:-500}
      LIKE_BEHAVIOR_CLAIM_LEASE: ${LIKE_BEHAVIOR_CLAIM_LEASE:-30s}
      LIKE_BEHAVIOR_FLUSH_INTERVAL: ${LIKE_BEHAVIOR_FLUSH_INTERVAL:-1s}
      LIKE_BEHAVIOR_PROJECTION_CONSUMERS: ${LIKE_BEHAVIOR_PROJECTION_CONSUMERS:-6}
      AI_API_KEY: ${AI_API_KEY:-}
  app:
    <<: *go-service
    profiles:
      - devcontainer
    environment:
      <<: *go-environment
    volumes:
      - ./:/workspace/mf:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sleep", "infinity"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:6060:6060"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  kafka:
    image: bitnamilegacy/kafka:latest
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - kafka_data:/bitnami/kafka
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    volumes:
      - ./Go.exchange/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    volumes:
      - ./Go.exchange/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./Go.exchange/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./Go.exchange/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
    external: true
    name: goexchange_postgres-data
  redis-data:
    external: true
    name: goexchange_redis-data
  kafka_data:
    external: true
    name: goexchange_kafka_data
  grafana-data:
    external: true
    name: goexchange_grafana-data
  go-mod-cache:
    external: true
    name: goexchange_go-mod-cache
  go-build-cache:
    external: true
    name: goexchange_go-build-cache
  minio-data:
    external: true
    name: mf_minio-data
