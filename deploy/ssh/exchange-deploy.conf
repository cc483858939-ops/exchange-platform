# Administrator-reviewed template; never installed automatically by CD.
# Keep global StrictModes yes. Preserve existing administrator AllowUsers rules.
Match User exchange-deploy
    AuthorizedKeysFile .ssh/authorized_keys
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
    ForceCommand /usr/bin/sudo -n /usr/local/sbin/exchange-production-cd "$SSH_ORIGINAL_COMMAND"
Match all
