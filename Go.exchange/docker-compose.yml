# Deprecated: this compose file was moved to D:/code/mf/docker-compose.yml.
# Prefer: cd D:/code/mf && docker compose up -d
# Running both old and new compose files can cause port and container conflicts.

x-go-service: &go-service
  image: goexchange-app
  build:
    context: .
    dockerfile: Dockerfile.dev
  working_dir: /workspace/mf/Go.exchange
  volumes:
    - ../../:/workspace:cached
    - go-mod-cache:/home/vscode/go/pkg/mod
    - go-build-cache:/home/vscode/.cache/go-build
  depends_on:
    - db
    - redis
    - kafka

services:
  migrate:
    <<: *go-service
    command: ["go", "run", "./cmd/migrate"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *go-service
    command: ["go", "run", "main.go"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      APP_RUNTIME_ROLE: api
      RECOMMENDATION_TELEMETRY_ENABLED: ${RECOMMENDATION_TELEMETRY_ENABLED:-false}
      RECOMMENDATION_TELEMETRY_ROLLOUT_PERCENT: ${RECOMMENDATION_TELEMETRY_ROLLOUT_PERCENT:-0}
      RECOMMENDATION_TELEMETRY_SIGNING_KEY: ${RECOMMENDATION_TELEMETRY_SIGNING_KEY:-}
      RECOMMENDATION_TELEMETRY_TOKEN_TTL: ${RECOMMENDATION_TELEMETRY_TOKEN_TTL:-24h}
      RECOMMENDATION_TELEMETRY_MAX_CLOCK_SKEW: ${RECOMMENDATION_TELEMETRY_MAX_CLOCK_SKEW:-5m}
      RECOMMENDATION_TELEMETRY_EVENTS_PER_MINUTE: ${RECOMMENDATION_TELEMETRY_EVENTS_PER_MINUTE:-1000}
    ports:
      - "3000:3000"

  worker:
    <<: *go-service
    command: ["go", "run", "main.go"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      APP_RUNTIME_ROLE: worker
      LIKE_BEHAVIOR_BATCH_SIZE: ${LIKE_BEHAVIOR_BATCH_SIZE:-500}
      LIKE_BEHAVIOR_CLAIM_LEASE: ${LIKE_BEHAVIOR_CLAIM_LEASE:-30s}
      LIKE_BEHAVIOR_FLUSH_INTERVAL: ${LIKE_BEHAVIOR_FLUSH_INTERVAL:-1s}
      LIKE_BEHAVIOR_PROJECTION_CONSUMERS: ${LIKE_BEHAVIOR_PROJECTION_CONSUMERS:-6}

  app:
    <<: *go-service
    profiles:
      - devcontainer
    volumes:
      - ../../:/workspace:cached
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["sleep", "infinity"]

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: test
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: "redis:alpine"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
      - "6060:6060"
    volumes:
      - redis-data:/data

  kafka:
    image: bitnamilegacy/kafka:latest
    ports:
      - "9094:9094"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    depends_on:
      - api
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  redis-data:
  kafka_data:
  grafana-data:
  go-mod-cache:
  go-build-cache:
