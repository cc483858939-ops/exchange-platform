app:
  name: CurrencyExchangeApp
  port: ":3000"

database:
  dsn: "host=db user=postgres password=1234 dbname=test port=5432 sslmode=disable TimeZone=Asia/Shanghai"
  maxidleconns: 11
  maxopenconns: 114

ai:
  base_url: "https://api.deepseek.com"
  api_key: "sk-1c2fe18dcd2246ab95c728d92cfcc415"
  model: "deepseek-chat"
  chunk_model: "deepseek-chat"
  main_model: "deepseek-chat"
  timeout_seconds: 30
  chunk_size: 1200
  chunk_overlap: 120
  max_chunk_parallelism: 3
  top_n_tags: 5

kafka:
  brokers:
    - "kafka:9092"
  article_analysis_topic: "goexchange.article.analysis.requested.v1"
  article_analysis_dlq_topic: "goexchange.article.analysis.dlq.v1"
  user_behavior_topic: "goexchange.user.behavior.v1"
  like_snapshot_topic: "goexchange.article.like.snapshot.v1"
  article_analysis_group_id: "goexchange-article-analysis-v1"
  user_behavior_group_id: "goexchange-user-behavior-projection-v1"
  like_snapshot_group_id: "goexchange-like-snapshot-projection-v1"
  outbox_poll_interval_seconds: 1
  job_lease_seconds: 120
  job_max_attempts: 5
recommendation:
  behavior_weights:
    view: 1
    like: 4
  category_weight: 3
  tag_weight: 2
  popularity_weight: 0.5
  freshness_weight: 1
storage:
  endpoint: "minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket: "go-exchange"
  use_ssl: false
