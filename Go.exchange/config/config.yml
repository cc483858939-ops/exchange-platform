app:
  name: CurrencyExchangeApp
  port: ":3000"

database:
  dsn: ""
  maxidleconns: 11
  maxopenconns: 114

embedding:
  enabled: false
  base_url: ""
  api_key: ""
  model: ""
  version: "post_embedding_v1"
  timeout_seconds: 10

kafka:
  brokers:
    - "kafka:9092"
  user_behavior_topic: "goexchange.user.behavior.v1"
  like_snapshot_topic: "goexchange.article.like.snapshot.v1"
  recommendation_events_topic: "goexchange.recommendation.events.v1"
  topic_replication_factor: 1
  user_behavior_partitions: 12
  like_snapshot_partitions: 6
  recommendation_events_partitions: 12
  user_behavior_group_id: "goexchange-user-behavior-projection-v1"
  like_snapshot_group_id: "goexchange-like-snapshot-projection-v1"
  recommendation_metrics_group_id: "goexchange-recommendation-metrics-v1"

outbox:
  poll_interval_seconds: 1

recommendation:
  behavior_weights:
    view: 0.5
    like: 6
    click: 1.5
    qualified_read: 3
    quick_bounce: -3
    not_interested: -6
  signal_half_life_days: 14
  feedback_lookback_days: 90
  semantic_weight: 4
  freshness_weight: 2
  popularity_weight: 0.5
  freshness_half_life_days: 2

storage:
  endpoint: "minio:9000"
  access_key: ""
  secret_key: ""
  bucket: "go-exchange"
  use_ssl: false
