app:
  name: CurrencyExchangeApp
  port: ":3000"

database:
  dsn: ""
  maxidleconns: 11
  maxopenconns: 114

embedding:
  enabled: false
  base_url: ""
  api_key: ""
  model: ""
  version: "post_embedding_v1"
  timeout_seconds: 10

kafka:
  brokers:
    - "kafka:9092"
  user_behavior_topic: "goexchange.user.behavior.v1"
  like_snapshot_topic: "goexchange.post.like.snapshot.v1"
  recommendation_events_topic: "goexchange.recommendation.events.v1"
  post_embedding_topic: "goexchange.post.embedding.v1"
  activity_events_topic: "goexchange.activity.events.v1"
  notification_dlq_topic: "goexchange.notification.projection.dlq.v1"
  topic_replication_factor: 1
  user_behavior_partitions: 12
  like_snapshot_partitions: 6
  recommendation_events_partitions: 12
  post_embedding_partitions: 6
  activity_events_partitions: 12
  notification_dlq_partitions: 3
  user_behavior_group_id: "goexchange-user-behavior-projection-v1"
  like_snapshot_group_id: "goexchange-like-snapshot-projection-v1"
  recommendation_metrics_group_id: "goexchange-recommendation-metrics-v1"
  post_embedding_group_id: "goexchange-post-embedding-v1"
  notification_group_id: "goexchange-notification-projection-v1"

outbox:
  retention_hours: 24
  cleanup_interval_seconds: 600
  cleanup_batch_size: 5000

recommendation:
  behavior_weights:
    view: 0.5
    like: 6
    click: 1.5
    qualified_read: 3
    reply: 5
    quick_bounce: -3
    not_interested: -6
  semantic_recall:
    recent_window_days: 30
    recent_ratio: 0.80
  fusion:
    rank_constant: 60
  trending:
    max_age_days: 7
    half_life_hours: 24
    reply_factor: 0.5
  exploration:
    ratio: 0.10
    max_slots: 3
    recent_window_days: 7
    novel_post_max_age_days: 30
  signal_half_life_days: 14
  feedback_lookback_days: 90
  semantic_weight: 4
  trending_weight: 0.5
  positive_signal_coexist_bonus: 1
  positive_post_weight_cap: 7
  negative_semantic_weight: 1.5
  negative_confidence_saturation_scale: 12
  author_affinity_weight: 1
  author_affinity_saturation_scale: 6
  following_bonus: 0.5
  out_of_network_min_ratio: 0.30
  served_hard_exclusion_minutes: 30
  served_soft_lookback_days: 7
  served_history_limit: 1000
  diversity:
    enabled: true
    author_window_size: 8
    max_same_author_in_window: 2
    semantic_duplicate_threshold: 0.92
    semantic_duplicate_penalty: 1
  trace:
    result_retention_days: 30
    request_retention_days: 90
    cleanup_interval_hours: 6
    cleanup_batch_size: 5000
  candidates:
    personalized:
      semantic: 200
      following: 150
      recent: 150
      trending: 150
      merged: 500
    cold_start:
      following: 200
      recent: 200
      trending: 200
      merged: 500
  profile_materialization:
    debounce_seconds: 2
    poll_interval_seconds: 1
    batch_size: 50
    rebuild_interval_hours: 6
    stale_scan_interval_seconds: 60
    stale_enqueue_batch_size: 500

storage:
  endpoint: "minio:9000"
  access_key: ""
  secret_key: ""
  bucket: "go-exchange"
  use_ssl: false
