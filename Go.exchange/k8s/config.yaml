apiVersion: v1
kind: ConfigMap
metadata:
  name: go-exchange-config
data:
  APP_PORT: "3000"
  REDIS_ADDR: "redis:6379"
  REDIS_DB: "0"
  REDIS_POOL_SIZE: "200"
  REDIS_MIN_IDLE_CONNS: "20"
  JWT_ISSUER: "go.exchange"
  JWT_AUDIENCE: "go.exchange.api"
  JWT_ACCESS_TTL: "15m"
  JWT_REFRESH_IDLE_TTL: "168h"
  JWT_REFRESH_ABSOLUTE_TTL: "720h"
  JWT_CLOCK_SKEW: "30s"
  LIKE_SNAPSHOT_POLL_INTERVAL: "1s"
  LIKE_SNAPSHOT_BATCH_SIZE: "100"
  LIKE_CLAIM_LEASE: "30s"
  LIKE_BEHAVIOR_BATCH_SIZE: "500"
  LIKE_BEHAVIOR_CLAIM_LEASE: "30s"
  LIKE_BEHAVIOR_FLUSH_INTERVAL: "1s"
  LIKE_BEHAVIOR_PROJECTION_CONSUMERS: "6"
  EMBEDDING_ENABLED: "false"
  EMBEDDING_BASE_URL: ""
  EMBEDDING_MODEL: ""
  EMBEDDING_VERSION: "post_embedding_v1"
  EMBEDDING_TIMEOUT_SECONDS: "10"
