apiVersion: batch/v1
kind: Job
metadata:
  name: go-exchange-migrate
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: go-exchange
        component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: your-registry/go-exchange:latest
          imagePullPolicy: IfNotPresent
          command: ["/app/go-exchange-migrate"]
          envFrom:
            - configMapRef:
                name: go-exchange-config
            - secretRef:
                name: go-exchange-runtime-secrets
