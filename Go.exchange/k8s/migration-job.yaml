apiVersion: batch/v1
kind: Job
metadata:
  generateName: go-exchange-migrate-
  labels:
    app: go-exchange
    component: migrate
  annotations:
    go.exchange/readiness-gate: "migration-complete-before-api-worker"
    go.exchange/release-revision: "injected-by-deploy-script"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: go-exchange
        component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: your-registry/go-exchange:replace-me
          imagePullPolicy: IfNotPresent
          command: ["/app/go-exchange-migrate"]
          envFrom:
            - configMapRef:
                name: go-exchange-config
            - secretRef:
                name: go-exchange-runtime-secrets
