apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-exchange-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-exchange
      component: worker
  template:
    metadata:
      labels:
        app: go-exchange
        component: worker
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: your-registry/go-exchange:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: go-exchange-config
            - secretRef:
                name: go-exchange-runtime-secrets
          env:
            - name: APP_RUNTIME_ROLE
              value: worker
          ports:
            - name: worker-health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: worker-health
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: worker-health
            initialDelaySeconds: 10
            periodSeconds: 10
