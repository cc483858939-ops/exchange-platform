apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-exchange-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: go-exchange
      component: api
  template:
    metadata:
      labels:
        app: go-exchange
        component: api
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: app
          image: your-registry/go-exchange:replace-me
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: go-exchange-config
            - secretRef:
                name: go-exchange-runtime-secrets
            - secretRef:
                name: go-exchange-api-auth-secrets
          env:
            - name: APP_RUNTIME_ROLE
              value: api
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
