# Example only. Do not commit real values. Prefer External Secrets or your
# platform secret manager and create both Secrets before applying Deployments.
apiVersion: v1
kind: Secret
metadata:
  name: go-exchange-runtime-secrets
type: Opaque
stringData:
  DATABASE_DSN: "replace-with-postgresql-dsn"
  REDIS_PASSWORD: "replace-with-redis-password"
  MINIO_ACCESS_KEY: "replace-with-minio-access-key"
  MINIO_SECRET_KEY: "replace-with-minio-secret-key"
  EMBEDDING_API_KEY: "replace-with-cloudflare-workers-ai-token"
---
# Provision the GC database role with SELECT, UPDATE, and DELETE on
# post_media_uploads only; see post-media-gc-grants.sql.example. The MinIO
# policy example is post-media-gc-minio-policy.json; scope it to this bucket.
apiVersion: v1
kind: Secret
metadata:
  name: go-exchange-post-media-gc-secrets
type: Opaque
stringData:
  # Provision this role with SELECT, UPDATE, and DELETE on post_media_uploads only.
  DATABASE_DSN: "host=postgres user=post_media_gc password=replace-with-dedicated-password dbname=goexchange port=5432 sslmode=require"
  # Use a dedicated MinIO identity restricted to s3:DeleteObject on the configured bucket.
  MINIO_ACCESS_KEY: "replace-with-post-media-gc-access-key"
  MINIO_SECRET_KEY: "replace-with-post-media-gc-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: go-exchange-api-auth-secrets
type: Opaque
stringData:
  JWT_ACTIVE_KID: "jwt-2026-01"
  JWT_PRIVATE_KEY_B64: "replace-with-base64-encoded-ed25519-pkcs8-pem"
  # Optional JSON object of old kid -> base64 public PEM during key rotation:
  # JWT_VERIFY_KEYS_B64: '{"jwt-2025-12":"..."}'
