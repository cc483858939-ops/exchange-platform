<svg xmlns="http://www.w3.org/2000/svg" width="1856" height="64" viewBox="0 0 1856 64">
  <!-- Sprite heart color mirrors the color-like token (#ff4d6d) from tokens.css. -->
  <defs>
    <path
      id="heart-outline"
      d="M20.5 8.75c0 5.05-8.5 9.95-8.5 9.95s-8.5-4.9-8.5-9.95A4.55 4.55 0 0 1 12 6.55a4.55 4.55 0 0 1 8.5 2.2Z"
      fill="none"
      stroke="#71767b"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      id="heart-filled"
      d="M20.5 8.75c0 5.05-8.5 9.95-8.5 9.95s-8.5-4.9-8.5-9.95A4.55 4.55 0 0 1 12 6.55a4.55 4.55 0 0 1 8.5 2.2Z"
      fill="#ff4d6d"
      stroke="#ff4d6d"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle id="burst-dot" cx="0" cy="0" r="1.35" />
    <path id="burst-diamond" d="M0-2.1 2.1 0 0 2.1-2.1 0Z" />
  </defs>

  <!-- Frame 0: neutral outline heart. -->
  <g transform="translate(0 0)">
    <g transform="translate(20 20)">
      <use href="#heart-outline" />
    </g>
  </g>

  <!-- Frame 1: first compression. -->
  <g transform="translate(64 0)">
    <g transform="translate(20 20)">
      <use href="#heart-outline" transform="translate(12 12) scale(.90) translate(-12 -12)" />
    </g>
  </g>

  <!-- Frame 2: deeper compression with a subordinate ignition point. -->
  <g transform="translate(128 0)">
    <circle cx="32" cy="32" r="1.2" fill="#f91880" opacity=".55" />
    <g transform="translate(20 20)">
      <use href="#heart-outline" transform="translate(12 12) scale(.76) translate(-12 -12)" />
    </g>
  </g>

  <!-- Frame 3: compressed outline with the first thin ring. -->
  <g transform="translate(192 0)">
    <circle cx="32" cy="32" r="2" fill="#f91880" opacity=".72" />
    <circle cx="32" cy="32" r="4.5" fill="none" stroke="#a855f7" stroke-width="1" opacity=".52" />
    <g transform="translate(20 20)">
