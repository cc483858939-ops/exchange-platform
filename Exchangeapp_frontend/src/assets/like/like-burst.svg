<svg xmlns="http://www.w3.org/2000/svg" width="1856" height="64" viewBox="0 0 1856 64">
  <defs>
    <!-- The heart geometry is intentionally identical to AppIcon.vue. -->
    <path
      id="heart-outline"
      d="M20.5 8.75c0 5.05-8.5 9.95-8.5 9.95s-8.5-4.9-8.5-9.95A4.55 4.55 0 0 1 12 6.55a4.55 4.55 0 0 1 8.5 2.2Z"
      fill="none"
      stroke="#71767b"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.8"
    />
    <path
      id="heart-filled"
      d="M20.5 8.75c0 5.05-8.5 9.95-8.5 9.95s-8.5-4.9-8.5-9.95A4.55 4.55 0 0 1 12 6.55a4.55 4.55 0 0 1 8.5 2.2Z"
      fill="#ff4d6d"
      stroke="#ff4d6d"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.8"
    />
    <circle id="burst-dot-large" cx="0" cy="0" r="1.35" />
    <circle id="burst-dot-small" cx="0" cy="0" r=".8" />

    <!-- Seven asymmetric pairs keep the tail soft and circular, never star-like. -->
    <g id="burst-particles">
      <use href="#burst-dot-large" transform="translate(32 5.2) scale(.95)" fill="#eab308" />
      <use href="#burst-dot-small" transform="translate(35.2 11.4) scale(.64)" fill="#f472b6" />
      <use href="#burst-dot-large" transform="translate(52.5 11.5) scale(.9)" fill="#a855f7" />
      <use href="#burst-dot-small" transform="translate(47.8 17.3) scale(.62)" fill="#06b6d4" />
      <use href="#burst-dot-large" transform="translate(60 34) scale(.92)" fill="#1d9bf0" />
      <use href="#burst-dot-small" transform="translate(53 35.8) scale(.62)" fill="#f472b6" />
      <use href="#burst-dot-large" transform="translate(51 54) scale(.9)" fill="#f97316" />
      <use href="#burst-dot-small" transform="translate(47.5 48.9) scale(.62)" fill="#a855f7" />
      <use href="#burst-dot-large" transform="translate(12.5 53.5) scale(.94)" fill="#f91880" />
      <use href="#burst-dot-small" transform="translate(16.5 48.8) scale(.64)" fill="#eab308" />
      <use href="#burst-dot-large" transform="translate(4.8 37) scale(.9)" fill="#a855f7" />
      <use href="#burst-dot-small" transform="translate(11.5 40.8) scale(.62)" fill="#1d9bf0" />
      <use href="#burst-dot-large" transform="translate(12.3 11.3) scale(.92)" fill="#06b6d4" />
      <use href="#burst-dot-small" transform="translate(16.3 16.5) scale(.65)" fill="#f91880" />
    </g>
  </defs>

  <!-- Frame 0: the exact unliked outline, before any motion. -->
  <g transform="translate(0 0)">
    <use href="#heart-outline" transform="translate(20 20)" />
  </g>

  <!-- Frame 1: outline heart compresses slightly. -->
  <g transform="translate(64 0)">
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.92) translate(-12 -12)">
        <use href="#heart-outline" />
      </g>
    </g>
  </g>

  <!-- Frame 2: outline heart compresses into the ignition point. -->
  <g transform="translate(128 0)">
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.72) translate(-12 -12)">
        <use href="#heart-outline" />
      </g>
    </g>
  </g>

  <!-- Frame 3: small outline remnant and pink ignition. -->
  <g transform="translate(192 0)">
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.48) translate(-12 -12)">
        <use href="#heart-outline" />
      </g>
    </g>
    <circle cx="32" cy="32" r="1.2" fill="#ff4d6d" opacity=".7" />
  </g>

  <!-- Frame 4: outline collapses into a tiny colored center. -->
  <g transform="translate(256 0)">
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.22) translate(-12 -12)">
        <use href="#heart-outline" />
      </g>
    </g>
    <circle cx="32" cy="32" r="2" fill="#f91880" opacity=".9" />
  </g>

  <!-- Frame 5: solid pink core. -->
  <g transform="translate(320 0)">
    <circle cx="32" cy="32" r="3.2" fill="#ff4d6d" />
  </g>

  <!-- Frame 6: solid bubble expands. -->
  <g transform="translate(384 0)">
    <circle cx="32" cy="32" r="7.2" fill="#f91880" />
  </g>

  <!-- Frame 7: solid magenta bubble reaches its broadest body. -->
  <g transform="translate(448 0)">
    <circle cx="32" cy="32" r="12.2" fill="#e94d91" />
  </g>

  <!-- Frame 8: full solid bubble, just before the hollow transition. -->
  <g transform="translate(512 0)">
    <circle cx="32" cy="32" r="17" fill="#c94de7" />
  </g>

  <!-- Frame 9: hollow ring begins; the heart is intentionally subordinate. -->
  <g transform="translate(576 0)">
    <circle cx="32" cy="32" r="18.5" fill="none" stroke="#f91880" stroke-width="6.4" opacity=".86" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.12) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
  </g>

  <!-- Frame 10: strongest ring, tiny heart, and the first subtle particles. -->
  <g transform="translate(640 0)">
    <circle cx="32" cy="32" r="20" fill="none" stroke="#a855f7" stroke-width="5.6" opacity=".9" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.2) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.45) translate(-32 -32)" opacity=".1" />
  </g>

  <!-- Frame 11: ring thins while the filled heart starts regrowing. -->
  <g transform="translate(704 0)">
    <circle cx="32" cy="32" r="21.5" fill="none" stroke="#f91880" stroke-width="4" opacity=".72" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.34) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.56) translate(-32 -32)" opacity=".25" />
  </g>

  <!-- Frame 12: heart reaches half size; ring remains visible but no longer dominates. -->
  <g transform="translate(768 0)">
    <circle cx="32" cy="32" r="23" fill="none" stroke="#d946ef" stroke-width="2.8" opacity=".5" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.58) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.67) translate(-32 -32)" opacity=".45" />
  </g>

  <!-- Frame 13: heart regrowth is nearly complete and particles spread quickly. -->
  <g transform="translate(832 0)">
    <circle cx="32" cy="32" r="24" fill="none" stroke="#f91880" stroke-width="1.8" opacity=".3" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(.82) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.78) translate(-32 -32)" opacity=".7" />
  </g>

  <!-- Frame 14: heart overshoots lightly; particles are close to full strength. -->
  <g transform="translate(896 0)">
    <circle cx="32" cy="32" r="25" fill="none" stroke="#a855f7" stroke-width="1" opacity=".16" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(1.04) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.88) translate(-32 -32)" opacity=".9" />
  </g>

  <!-- Frame 15: heart peak and maximum particle energy; the ring nearly disappears. -->
  <g transform="translate(960 0)">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#f91880" stroke-width=".8" opacity=".06" />
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(1.14) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.94) translate(-32 -32)" opacity="1" />
  </g>

  <!-- Frame 16: ring is gone; heart settles while particles remain active. -->
  <g transform="translate(1024 0)">
    <g transform="translate(20 20)">
      <g transform="translate(12 12) scale(1.05) translate(-12 -12)">
        <use href="#heart-filled" />
      </g>
    </g>
    <use href="#burst-particles" transform="translate(32 32) scale(.98) translate(-32 -32)" opacity=".9" />
  </g>

  <!-- Frame 17: heart is effectively stable; particles continue outward. -->
  <g transform="translate(1088 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(1) translate(-32 -32)" opacity=".8" />
  </g>

  <!-- Frame 18: stable heart with the last outward particle step. -->
  <g transform="translate(1152 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(1.01) translate(-32 -32)" opacity=".7" />
  </g>

  <!-- Frame 19: stable heart and visible particle decay. -->
  <g transform="translate(1216 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(1.01) translate(-32 -32)" opacity=".6" />
  </g>

  <!-- Frame 20: particle tail continues after the heart has stopped moving. -->
  <g transform="translate(1280 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(1.01) translate(-32 -32)" opacity=".5" />
  </g>

  <!-- Frame 21: softer outward residue. -->
  <g transform="translate(1344 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(1.01) translate(-32 -32)" opacity=".4" />
  </g>

  <!-- Frame 22: low-opacity colored dots remain around the stable heart. -->
  <g transform="translate(1408 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(1) translate(-32 -32)" opacity=".3" />
  </g>

  <!-- Frame 23: residual particles fade. -->
  <g transform="translate(1472 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(.99) translate(-32 -32)" opacity=".2" />
  </g>

  <!-- Frame 24: only a quiet trace remains. -->
  <g transform="translate(1536 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(.98) translate(-32 -32)" opacity=".12" />
  </g>

  <!-- Frame 25: almost-finished particle tail. -->
  <g transform="translate(1600 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(.97) translate(-32 -32)" opacity=".07" />
  </g>

  <!-- Frame 26: final residual particles before the exact stable state. -->
  <g transform="translate(1664 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
    <use href="#burst-particles" transform="translate(32 32) scale(.96) translate(-32 -32)" opacity=".03" />
  </g>

  <!-- Frame 27: exact filled AppIcon geometry, no particles. -->
  <g transform="translate(1728 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
  </g>

  <!-- Frame 28: exact final stable frame, identical to Frame 27. -->
  <g transform="translate(1792 0)">
    <use href="#heart-filled" transform="translate(20 20)" />
  </g>
</svg>
